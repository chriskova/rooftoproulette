<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Rooftop Roulette</title>
<meta name="description" content="Spin. Walk. Drink. Beat the clock. A rooftop bar crawl game for Sydney.">
<meta name="theme-color" content="#0B0D12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rooftop Roulette">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:500;font-display:swap;src:url(fonts/big-shoulders-display-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
:root{
  --bg:#0B0D12;--s1:#141820;--s2:#1C212C;--s3:#262C39;--line:#2A303D;
  --text:#F4F1EA;--muted:#9AA1AD;--dim:#6B7280;
  --amber:#F5B83D;--amber-ink:#241803;--amber-soft:rgba(245,184,61,.14);
  --green:#4ADE80;--green-soft:rgba(74,222,128,.12);--red:#FF5A4E;--blue:#5AA9FF;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:18px;--tab:64px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.4;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{max-width:480px;margin:0 auto;height:100dvh;position:relative;display:flex;flex-direction:column;overflow:hidden}
.view>*{flex-shrink:0}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:6px 18px 24px;display:flex;flex-direction:column;gap:16px}
.app.has-tabs .view{padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 24px)}
.app.has-cta .view{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* bottom tabs */
.tabs{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:rgba(14,17,23,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:900}
.tabs button{flex:1;appearance:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11.5px;font-weight:600;letter-spacing:.01em}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--text)}
.tabs button[aria-selected="true"] svg{color:var(--amber)}
.tabs .live{width:6px;height:6px;border-radius:50%;background:var(--amber);position:absolute;margin:-18px 0 0 22px}

/* type */
h1,h2,h3{margin:0}
.brand{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:.92}
.brand span{color:var(--amber)}
.q{font-size:28px;font-weight:750;line-height:1.15;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px}
.small{font-size:13px;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* buttons */
.btn{appearance:none;border:0;border-radius:16px;height:56px;padding:0 20px;width:100%;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--amber);color:var(--amber-ink);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35}
.btn.dark{background:var(--s2);color:var(--text)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--text)}
.btn.sm{height:44px;font-size:15px;border-radius:13px}
.btn svg{width:20px;height:20px;flex:none}
a.btn{text-decoration:none}
.txtbtn{appearance:none;background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;padding:10px 4px}
.txtbtn.amber{color:var(--amber)}
.iconbtn{appearance:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--s2);display:grid;place-items:center;color:var(--text);flex:none}
.iconbtn svg{width:22px;height:22px}
.cta{position:absolute;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:800;max-width:480px;margin:0 auto}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.opt{appearance:none;width:100%;text-align:left;background:var(--s1);border:1.5px solid var(--line);border-radius:var(--r);padding:15px 16px;display:flex;align-items:center;gap:14px;transition:border-color .12s,background .12s}
.opt[aria-checked="true"]{border-color:var(--amber);background:var(--amber-soft)}
.opt .ic{width:42px;height:42px;border-radius:12px;background:var(--s2);display:grid;place-items:center;flex:none;color:var(--amber)}
.opt .ic svg{width:22px;height:22px}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:16.5px;font-weight:700}
.opt .t small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.opt .n{text-align:right;flex:none}
.opt .n b{display:block;font-size:20px;font-weight:750;color:var(--amber);line-height:1}
.opt .n small{font-size:11px;color:var(--muted)}
.opt:disabled{opacity:.4}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--amber);color:var(--amber-ink);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.opts{display:flex;flex-direction:column;gap:10px}
.note{font-size:13.5px;color:var(--muted);line-height:1.5}
.alertbox{border:1px solid rgba(255,90,78,.5);background:rgba(255,90,78,.08);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
.alertbox b{color:var(--red)}

/* wizard top */
.wtop{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:6px;background:var(--s2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .3s}

/* intro */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding:10px 6px}
.intro .art{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(245,184,61,.22),transparent 70%);display:grid;place-items:center}
.intro .art svg{width:120px;height:120px;color:var(--amber)}
.dots{display:flex;gap:7px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--s3);transition:width .2s}
.dots i.on{width:22px;background:var(--amber)}

/* home */
.hero{border-radius:24px;padding:22px 20px;background:radial-gradient(120% 90% at 100% 0%,rgba(245,184,61,.25),transparent 60%),var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;overflow:hidden;position:relative}
.hero .brand{font-size:46px}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .k{width:30px;height:30px;border-radius:50%;background:var(--s2);color:var(--amber);font-weight:800;display:grid;place-items:center;flex:none;font-size:14px}
.step b{display:block;font-size:15px}
.step span{color:var(--muted);font-size:13.5px}
.statrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.mini small{display:block;font-size:12px;color:var(--muted)}
.mini b{font-size:22px;font-weight:750}

/* maps */
.map{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#0F1218;position:relative}
.leaflet-container{background:#0F1218;font-family:var(--ui)}
.osm .leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.78) contrast(.95)}
.leaflet-control-attribution{font-size:9px!important;background:rgba(11,13,18,.7)!important;color:var(--dim)!important}
.leaflet-control-attribution a{color:var(--dim)!important}
.pin{width:16px;height:16px;border-radius:50%;background:var(--amber);border:2.5px solid #0B0D12;box-shadow:0 0 0 1px rgba(245,184,61,.35),0 2px 6px rgba(0,0,0,.5)}
.pin.off{background:#4B5160;box-shadow:none;width:12px;height:12px;border-width:2px}
.pin.big{width:26px;height:26px;border-width:3.5px;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,184,61,.55)}100%{box-shadow:0 0 0 16px rgba(245,184,61,0)}}
.num{width:24px;height:24px;border-radius:50%;background:var(--amber);color:var(--amber-ink);font:800 12px/19px var(--ui);text-align:center;border:2.5px solid #0B0D12}
.num.x{opacity:.45}
.me{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 6px rgba(90,169,255,.25)}

/* play */
.ptop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.count b{color:var(--amber)}
.clock{text-align:center;line-height:1}
.clock b{display:block;font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clock small{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.clock.warn b,.clock.warn small{color:var(--amber)}
.clock.red b,.clock.red small{color:var(--red)}
.tbar{height:5px;background:var(--s2);border-radius:99px;overflow:hidden;margin-top:-6px}
.tbar i{display:block;height:100%;background:var(--text);border-radius:99px;transition:width 1s linear}
.tbar.warn i{background:var(--amber)}.tbar.red i{background:var(--red)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.strip::-webkit-scrollbar{display:none}
.pip{flex:none;font-size:13px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--s1);border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.pip.yes{color:var(--green);border-color:rgba(74,222,128,.4)}
.pip.no{text-decoration:line-through;opacity:.5}
.pip.q{color:var(--amber);border-style:dashed;border-color:var(--amber)}
.pip.here{color:var(--amber);border-color:var(--amber)}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.wheel{appearance:none;width:min(62vw,230px);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 50% 35%,#FFD27A,var(--amber) 55%,#D9951B);color:var(--amber-ink);font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.1em;box-shadow:0 0 0 10px var(--amber-soft),0 0 0 22px rgba(245,184,61,.06),0 18px 40px rgba(0,0,0,.45);transition:transform .1s}
.wheel:active{transform:scale(.96)}
.wheel small{display:block;font-family:var(--ui);font-size:12px;font-weight:700;letter-spacing:.08em;margin-top:2px;opacity:.75}
.reel{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.reelrow{height:28px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reelrow.mid{height:64px;font-weight:800;font-size:clamp(24px,8vw,34px);color:var(--amber);background:var(--s2);border:1.5px solid var(--amber);border-radius:12px}
.flip{animation:flip 70ms ease-out}
@keyframes flip{from{transform:translateY(-30%);opacity:.3}to{transform:none;opacity:1}}
.bar{width:100%;border-radius:22px;padding:18px;background:var(--amber);color:var(--amber-ink);display:flex;flex-direction:column;gap:10px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.bar .eyebrow{color:rgba(36,24,3,.65)}
.bar h2{font-family:var(--display);font-weight:800;font-size:clamp(32px,10vw,44px);line-height:.95;text-transform:uppercase}
.bar .facts{display:flex;gap:16px;flex-wrap:wrap;font-size:14.5px;font-weight:600}
.bar .facts span{display:flex;align-items:center;gap:5px}
.bar .facts svg{width:17px;height:17px}
.bar .btn{background:var(--amber-ink);color:var(--amber)}
.bar.at{background:var(--s1);color:var(--text);border:1.5px solid var(--green)}
.bar.at .eyebrow{color:var(--green)}
.dwell{font-family:var(--display);font-weight:800;font-size:40px;font-variant-numeric:tabular-nums;line-height:1}
.tip{width:100%;background:var(--s2);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start;position:relative}
.tip::before{content:"";position:absolute;top:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top:0;border-bottom-color:var(--s2)}
.tip.nob::before{display:none}
.tip svg{width:20px;height:20px;color:var(--amber);flex:none;margin-top:1px}
.tip button{appearance:none;background:none;border:0;color:var(--amber);font-weight:700;font-size:13.5px;padding:0;margin-left:auto;flex:none}
.ask{width:100%;background:var(--s1);border:1.5px solid var(--amber);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ask b{font-size:16px}
.ask .row{display:flex;gap:8px}
.ask .row .btn{height:44px;font-size:15px}
.banner{width:100%;border-radius:14px;padding:12px 14px;background:var(--amber-soft);border:1px solid rgba(245,184,61,.45);font-size:14px;line-height:1.45;color:var(--text)}
.banner b{color:var(--amber)}

/* sheets */
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;max-width:480px;width:100%;border:0;border-radius:24px 24px 0 0;background:var(--s1);color:var(--text);padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:85dvh;overflow-y:auto}
dialog.sheet::backdrop{background:rgba(0,0,0,.6)}
dialog.sheet[open]{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40%)}to{transform:none}}
.grab{width:40px;height:5px;border-radius:99px;background:var(--s3);margin:0 auto 14px}
.sheet h3{font-size:22px;font-weight:750;margin-bottom:4px}
.sheet .opts{margin-top:14px}
.menu{display:flex;flex-direction:column;margin-top:8px}
.menu button{appearance:none;background:none;border:0;border-top:1px solid var(--line);text-align:left;padding:15px 2px;display:flex;gap:14px;align-items:center;font-size:16px;font-weight:600}
.menu button:first-child{border-top:0}
.menu button svg{width:22px;height:22px;color:var(--muted)}
.menu button small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:1px}
.menu button.danger{color:var(--red)}
.menu button.danger svg{color:var(--red)}

/* score */
.score{text-align:center;padding:22px 16px;border-radius:24px;background:radial-gradient(100% 80% at 50% 0%,rgba(245,184,61,.25),transparent 70%),var(--s1);border:1px solid var(--line)}
.score .big{font-family:var(--display);font-weight:800;font-size:110px;line-height:.85;color:var(--amber)}
.score .lbl{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.06em}
.score .pb{display:inline-block;margin-top:10px;background:var(--amber);color:var(--amber-ink);font-weight:800;font-size:13px;border-radius:99px;padding:5px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.stat small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:16px;font-weight:700;margin-top:3px}
.stat.w{grid-column:1/-1}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.li:first-child{border-top:0}
.li .r{color:var(--muted);font-size:13.5px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--s2);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.photo img{width:100%;border-radius:14px;display:block;margin-top:10px}

/* rooftops tab */
.barrow{appearance:none;width:100%;background:none;border:0;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:13px 0;text-align:left}
.barrow:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--amber);flex:none}
.dot.off{background:#4B5160}
.barrow .t{flex:1;min-width:0}
.barrow .t b{display:block;font-size:15.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .t small{color:var(--muted);font-size:13px}
.barrow .r{color:var(--muted);font-size:13px;white-space:nowrap}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;appearance:none;border:0;background:none;border-radius:9px;padding:8px;font-size:14px;font-weight:650;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--text)}

/* history */
.hrow{appearance:none;width:100%;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:14px;text-align:left}
.hrow .n{font-family:var(--display);font-weight:800;font-size:38px;color:var(--amber);width:44px;text-align:center;line-height:1}
.hrow .t{flex:1;min-width:0}
.hrow .t b{display:block;font-size:15px}
.hrow .t small{color:var(--muted);font-size:13px}
.hrow img{width:48px;height:48px;border-radius:10px;object-fit:cover}
.empty{text-align:center;padding:40px 20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty svg{width:56px;height:56px;color:var(--s3)}

/* test */
.testfab{position:absolute;right:12px;bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 12px);z-index:950;appearance:none;border:1.5px dashed var(--blue);background:rgba(11,13,18,.9);color:var(--blue);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:800;letter-spacing:.08em}
.trow{display:flex;gap:8px;flex-wrap:wrap}
.trow .btn{width:auto;flex:1;min-width:30%}
.sheet select{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.flip,.bar,.pin.big,dialog.sheet[open]{animation:none}}

/* v4 additions */
.board{width:100%;display:flex;flex-direction:column;gap:6px;padding:10px;background:#0E1117;border:1px solid var(--line);border-radius:20px;perspective:600px;transition:box-shadow .3s,border-color .3s}
.board.live{border-color:rgba(245,184,61,.55);box-shadow:0 0 0 4px var(--amber-soft),0 0 50px rgba(245,184,61,.15)}
.flap{position:relative;height:38px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#20252f 0 50%,#1a1e26 50% 100%);border-radius:7px;font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);overflow:hidden;transform-origin:50% 0}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;background:#0B0D12;box-shadow:0 1px 0 rgba(255,255,255,.04)}
.flap span{position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:94%}
.flap.f2{height:30px;font-size:15px;opacity:.45}
.flap.f1{opacity:.75}
.flap.mid{height:76px;font-weight:800;font-size:clamp(26px,8.5vw,36px);color:var(--amber);background:linear-gradient(#232832 0 50%,#1c2029 50% 100%);border:1.5px solid var(--amber)}
.flap-go{animation:flapgo 90ms ease-out}
@keyframes flapgo{from{transform:rotateX(-75deg);filter:brightness(1.6)}to{transform:none;filter:none}}
.flap.landed{animation:landed .7s ease-out}
@keyframes landed{0%{background:var(--amber);color:var(--amber-ink)}60%{background:var(--amber);color:var(--amber-ink)}100%{}}
.board.won{box-shadow:0 0 0 6px rgba(245,184,61,.25),0 0 70px rgba(245,184,61,.35)}
.wheel.sm{width:min(44vw,170px);font-size:38px;box-shadow:0 0 0 8px var(--amber-soft),0 14px 30px rgba(0,0,0,.45)}
.wheel.going{animation:pulse2 .6s infinite alternate;opacity:.85}
@keyframes pulse2{to{transform:scale(.95)}}
.ready{gap:20px}
.farhead{padding:16px 0 6px;border-top:1px solid var(--line)}

.ready{gap:26px}
.ready .wheel{margin:10px 0}
.reel.big{width:100%;padding:14px 12px;gap:8px;border-radius:24px;border:1.5px solid rgba(245,184,61,.45);box-shadow:0 0 40px rgba(245,184,61,.12);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%,#000 78%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 22%,#000 78%,transparent 100%)}
.reel.big .reelrow{height:40px;font-size:20px}
.reel.big .reelrow.f1{opacity:.7}
.reel.big .reelrow.f2{opacity:.35;font-size:17px}
.reel.big .reelrow.mid{height:84px;font-size:clamp(30px,10vw,40px)}
.tip.soft{background:var(--s1);border:1px solid var(--line);color:var(--muted);font-size:13.5px}
.tip.soft b{color:var(--text);font-weight:650}
.tip.soft svg{color:var(--muted)}
.tip.soft.ok{border-color:rgba(74,222,128,.4)}
.tip.soft.ok svg{color:var(--green)}

#v-home{padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.appbar{flex:none;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 6px;background:var(--bg);z-index:10}
.logo{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.16em;user-select:none}
.logo span{color:var(--amber)}
.ready{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;min-height:calc(100dvh - 300px);justify-content:center}
.mixline{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mixline span{font-size:12.5px;font-weight:650;color:var(--muted);background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.poolnum{font-size:14px;color:var(--muted)}.poolnum b{color:var(--amber);font-size:16px}
.spinning{background:radial-gradient(60% 45% at 50% 50%,rgba(245,184,61,.14),transparent 70%)}
.machine{width:100%;background:var(--s1);border:1.5px solid rgba(245,184,61,.5);border-radius:22px;padding:10px 12px;box-shadow:0 0 40px rgba(245,184,61,.12)}
.machine .reel{border:0;background:none;padding:6px 0}
.bulbs{display:flex;justify-content:space-between;padding:0 6px}
.bulbs i{width:8px;height:8px;border-radius:50%;background:var(--amber);opacity:.25;animation:bulb .5s infinite}
.bulbs i:nth-child(odd){animation-delay:.25s}
@keyframes bulb{0%,49%{opacity:1;box-shadow:0 0 8px var(--amber)}50%,100%{opacity:.25;box-shadow:none}}
.bar.at.photo{box-shadow:none}
.bar.at.photo::after{content:"";position:absolute;inset:0;border:2px solid var(--green);border-radius:inherit;pointer-events:none;z-index:3}
.bar.photo{min-height:300px}
.num.sm{width:16px;height:16px;font:800 9px/12px var(--ui);border-width:2px}
.mix{gap:10px}
.zlist .zrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.zrow .t{flex:1;min-width:0}.zrow .t b{display:block;font-size:15px;font-weight:650}.zrow .t small{color:var(--muted);font-size:12.5px}
.zrow.off .t{opacity:.45}
.lo{appearance:none;border:1.5px solid var(--line);background:none;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted);flex:none}
.lo[aria-pressed="true"]{border-color:var(--red);color:var(--red)}
.lo:disabled{opacity:.35}
.tick{appearance:none;width:100%;background:none;border:0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:15px;text-align:left}
.tick:first-child{border-top:0}
.tick i{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none}
.tick[aria-pressed="true"] i{background:var(--amber);border-color:var(--amber);box-shadow:inset 0 0 0 3px var(--s1)}
.tri.two{grid-template-columns:1fr 1fr}
.tri b{font-size:44px}.tri b i{font-style:normal;font-size:22px;margin-left:3px}
.tri small{font-size:13px}
.aw-t{font-size:48px}.aw-w{font-size:15px}
.quad div{font-size:14.5px;padding-top:8px}.quad small{font-size:13.5px}
.sc-bars{font-size:14px}
.prompt{background:var(--s1);border:1.5px solid var(--amber);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 0 4px var(--amber-soft)}
.prompt.done{border-color:var(--line);box-shadow:none}
.prompt .pt{font-size:19px;font-weight:750}
.prompt .ps{font-size:13.5px;color:var(--muted);margin-top:-6px}
.bod{display:flex;flex-direction:column;gap:6px}
.bod button{appearance:none;display:flex;justify-content:space-between;align-items:center;background:var(--s2);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:650;text-align:left}
.bod button i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.bod button[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft)}
.bod button[aria-pressed="true"] i{background:var(--amber);border-color:var(--amber)}
.camzone{border:2px dashed var(--line);border-radius:16px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--dim);font-size:13px}
.camzone svg{width:30px;height:30px}
.crew{width:100%;border-radius:14px;display:block}

.bar.photo{background-color:#111;background-size:cover;background-position:center;color:#fff;position:relative;min-height:340px;justify-content:flex-end;overflow:hidden;border:0}
.bar.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.94) 0%,rgba(0,0,0,.72) 42%,rgba(0,0,0,.15) 78%,rgba(0,0,0,.05) 100%)}
.bar.photo>*{position:relative;z-index:1}
.bar.photo .eyebrow{color:var(--amber)}
.bar.photo .btn{background:var(--amber);color:var(--amber-ink)}
.bar.photo .wild{background:rgba(245,184,61,.16);border-color:rgba(245,184,61,.55);color:#fff}
.bar.photo .wild svg{color:var(--amber)}
.bar.photo .small{color:rgba(255,255,255,.75)}
.bar.at.photo{box-shadow:inset 0 0 0 2px var(--green)}
.bar.at.photo .eyebrow{color:var(--green)}
.bar>.cr{position:absolute!important;top:10px;right:10px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:2px 7px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
.bar>.cr a{color:#fff}
.again{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.fine{font-size:12.5px;color:var(--muted)}
.seg button{font-size:13px;padding:8px 4px}
.chev{color:var(--dim);font-size:20px;line-height:1;margin-left:2px}
.sc{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sc-top{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 -8px}
.award{text-align:center;padding:4px 0 2px}
.aw-t{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;text-transform:uppercase;letter-spacing:.02em;margin-top:6px}
.aw-w{color:var(--muted);font-size:14px;margin-top:6px}
.aw-more{display:flex;justify-content:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.aw-more span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:4px 9px;color:var(--muted)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri div{background:var(--s2);border-radius:14px;padding:10px 8px;text-align:center}
.tri b{display:block;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--amber)}
.tri small{font-size:11.5px;color:var(--muted)}
.sc .map{border-radius:14px}
.sc-bars{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}
.sc-bars .x{color:var(--dim);text-decoration:line-through}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.quad div{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.quad small{color:var(--muted);font-size:12.5px}
.quad b{font-weight:650;white-space:nowrap}

.bph{position:relative;margin:-18px -18px 4px;height:0;overflow:hidden;border-radius:22px 22px 0 0;transition:height .35s ease;background:rgba(36,24,3,.15)}
.bph.on{height:180px}
.bar.at .bph{border-radius:20px 20px 0 0;margin:-18px -18px 4px}
.bph img{width:100%;height:100%;object-fit:cover;display:block}
.bph .cr{position:absolute;left:8px;bottom:7px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:2px 7px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bph .cr a{color:#fff;text-decoration:underline}
.sheetph{margin:-10px -18px 14px;border-radius:24px 24px 0 0}
.sheetph.on{height:200px}

.wild{display:flex;gap:10px;align-items:flex-start;background:rgba(36,24,3,.12);border:1.5px dashed rgba(36,24,3,.45);border-radius:14px;padding:11px 12px;font-size:15px;font-weight:650;line-height:1.35}
.wild svg{width:22px;height:22px;flex:none}
.wild b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.wild small{display:block;font-size:12px;font-weight:500;opacity:.7;margin-top:3px}
.wild.dark{background:var(--amber-soft);border-color:rgba(245,184,61,.5);color:var(--text);margin-top:6px}
.wild.dark svg{color:var(--amber)}
.cf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;z-index:2000;pointer-events:none;animation:cf 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes cf{to{transform:translate(var(--x),105dvh) rotate(var(--r));opacity:.9}}
.duo{display:flex;justify-content:center;align-items:flex-start;gap:22px}
.duo .big{font-size:96px}
.duo .sep{width:1px;align-self:stretch;background:var(--line);margin-top:8px}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;padding:0 10px;font-size:15.5px}
@media (prefers-reduced-motion:reduce){.cf{display:none}}

.ptop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.ptop .count{justify-self:start}
.ptop .iconbtn{justify-self:end}
.stage{gap:18px;padding:14px 0 6px}
.stage .btn{margin:2px 0}
.wheel{margin:12px 0}
.wheel small{font-size:12.5px;letter-spacing:.04em;text-transform:none}
.bar.anim{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.bar{animation:none}
.bar .photo-ph{height:0}
.links{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
.links .txtbtn{padding:6px 2px}
.clock .pre{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);text-transform:none}
.prog-row{display:flex;align-items:center;gap:12px}
.pbar{flex:1;height:8px;background:var(--s2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--amber);border-radius:99px}
.colcard{display:flex;flex-direction:column;gap:12px;appearance:none;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.colcard .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--amber)}
.colcard .big span{font-size:22px;color:var(--muted)}
.areas{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.areas::-webkit-scrollbar{display:none}
.achip{flex:none;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:118px}
.achip b{display:block;font-size:13.5px;white-space:nowrap}
.achip small{display:block;color:var(--muted);font-size:12px;margin:2px 0 7px}
.achip .pbar{height:5px}
.achip.done{border-color:var(--amber)}
.stamp{flex:none;font-size:11px;font-weight:800;letter-spacing:.04em;border-radius:7px;padding:3px 7px;text-transform:uppercase}
.stamp.col{background:var(--amber);color:var(--amber-ink)}
.stamp.been{background:var(--s3);color:var(--text)}
.stamp.nfu{background:none;border:1px solid var(--line);color:var(--dim)}
.barrow.hid{opacity:.5}
.toggle{display:flex;align-items:center;gap:14px;background:var(--s1);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;appearance:none;width:100%;text-align:left}
.toggle .t{flex:1}
.toggle .t b{display:block;font-size:15.5px}
.toggle .t small{color:var(--muted);font-size:13px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-checked="true"] .sw{background:var(--amber)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(20px)}
.toggle[aria-checked="true"]{border-color:var(--amber)}
.zlist{display:flex;flex-direction:column}
.zlist .li{font-size:14.5px;padding:10px 0}
.newpill{display:inline-block;background:var(--green-soft);color:var(--green);font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.sheet .acts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.city{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.city b{color:var(--text)}
.pin{width:20px;height:20px;border-width:3px}
.pin.off{width:13px;height:13px}
.pin.done{background:var(--text)}
.gmlink{display:inline-block;font-size:13px;font-weight:600;color:inherit;opacity:.85;margin:-2px 0 8px;text-decoration:underline;text-underline-offset:3px}
#quickGo{margin-top:-4px}
.qfrom{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.qfrom::-webkit-scrollbar{display:none}
.qfrom .chip{flex:none;display:flex;align-items:center;gap:6px;color:var(--text)}
.qfrom .chip svg{width:15px;height:15px}
.qfrom .chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
#v-quick{display:flex;flex-direction:column;gap:16px}
#v-quick[hidden]{display:none}
.qgame{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.qgame .btn{width:auto;padding:0 16px;margin-top:6px}
.reel{position:relative;perspective:800px;width:100%;height:290px;overflow:hidden;border-radius:20px;background:#0E1117;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;-webkit-mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent)}
.reel .frame{position:absolute;z-index:2;left:8px;right:8px;top:50%;height:78px;margin-top:-39px;border:2px solid var(--amber);border-radius:14px;background:linear-gradient(#221d14,#17140f);box-shadow:0 0 0 4px rgba(245,184,61,.12),0 0 30px rgba(245,184,61,.12);overflow:hidden;pointer-events:none}
.reel .lens{position:absolute;inset:0}
.reel .lens .row span{display:inline-block}
.reel .frame::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(rgba(255,255,255,.09),rgba(255,255,255,0) 46%,rgba(0,0,0,0) 70%,rgba(0,0,0,.25));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -8px 16px rgba(0,0,0,.25);pointer-events:none}
.reel .lens .row{height:74px;margin-top:-37px;font-weight:800;font-size:clamp(30px,9.6vw,42px);color:#fff}
.reel.won .lens .row{color:var(--amber)}
.reel .lens .row.long{font-size:clamp(24px,7.4vw,33px)}
.reel .lens .row.ph{color:var(--amber);font-size:clamp(30px,9.6vw,42px);letter-spacing:0}
.reel .row{backface-visibility:hidden;position:absolute;left:0;right:0;top:50%;height:58px;margin-top:-29px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:500;font-size:clamp(24px,7.6vw,32px);letter-spacing:0;text-transform:uppercase;color:var(--muted);will-change:transform;pointer-events:none}
.reel .row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88%}
.reel .row.long{font-size:clamp(19px,6vw,25px)}
.reel .row.ph{color:var(--muted)}

.reel.won .frame{box-shadow:0 0 0 7px rgba(245,184,61,.28),0 0 60px rgba(245,184,61,.45)}
.flyname{position:fixed;z-index:61;pointer-events:none;transform-origin:0 0;margin:0}
.flybox{position:fixed;z-index:60;pointer-events:none;border:2px solid var(--amber);box-sizing:border-box;background:linear-gradient(#221d14,#17140f);box-shadow:0 0 0 4px rgba(245,184,61,.12),0 0 30px rgba(245,184,61,.12)}
.reel .hint{position:absolute;z-index:3;inset:0;display:flex;justify-content:center;pointer-events:none;transition:opacity .2s}
.reel .hint.off{opacity:0}
.reel .hint i{position:absolute;top:22%;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.75);box-shadow:0 0 0 8px rgba(255,255,255,.08);animation:swipehint 1.9s cubic-bezier(.5,0,.3,1) infinite}
.reel .hint i::before{content:"";position:absolute;left:50%;bottom:100%;width:6px;margin-left:-3px;height:0;border-radius:3px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.45));animation:swipetrail 1.9s cubic-bezier(.5,0,.3,1) infinite}
@keyframes swipehint{0%{transform:translateY(-10px) scale(.8);opacity:0}15%{transform:translateY(0) scale(1);opacity:1}60%{transform:translateY(120px) scale(1);opacity:1}80%,100%{transform:translateY(140px) scale(.9);opacity:0}}
@keyframes swipetrail{0%,15%{height:0}60%{height:110px}80%,100%{height:0}}
.reelnote{text-align:center;margin:0}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="appbar" id="appbar"><div class="logo" id="logo">ROOFTOP <span>ROULETTE</span></div></header>

  <!-- INTRO (first open) -->
  <section class="view" id="v-intro" hidden>
    <div style="display:flex;justify-content:flex-end"><button class="txtbtn" id="introSkip" type="button">Skip</button></div>
    <div class="intro" id="introBody"></div>
    <div class="dots" id="introDots"><i></i><i></i><i></i></div>
    <button class="btn" id="introNext" type="button">Next</button>
  </section>

  <!-- FIRST-TIME SETUP -->
  <section class="view" id="v-ob" hidden>
    <div class="wtop"><div class="prog"><i id="obProg"></i></div></div>
    <div id="obBody" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>

  <!-- HOME -->
  <section class="view" id="v-home" hidden>
    <div class="hero">
      <div class="brand" id="heroBrand">Rooftop<br><span>Roulette</span></div>
      <div class="sub" style="color:var(--text)">Spin. Go. Drink. Repeat.</div>
      <button class="btn" id="newGame" type="button">Start a new game</button>
      <button class="btn line" id="quickGo" type="button">Just pick one for us</button>
    </div>
    <div class="card">
      <div class="eyebrow" style="margin-bottom:12px">How it works</div>
      <div class="steps" id="homeSteps"></div>
    </div>
    <div class="city">${PIN} <span><b>Sydney</b> only, for now.</span></div>
  </section>

  <!-- WIZARD -->
  <section class="view" id="v-wiz" hidden>
    <div class="wtop">
      <button class="iconbtn" id="wBack" type="button" aria-label="Back"></button>
      <div class="prog"><i id="wProg"></i></div>
      <button class="iconbtn" id="wClose" type="button" aria-label="Close"></button>
    </div>
    <div id="wBody" style="display:flex;flex-direction:column;gap:16px"></div>
  </section>

  <!-- LOCATION PRIMER -->
  <section class="view" id="v-perm" hidden>
    <div class="wtop"><button class="iconbtn" id="pBack" type="button" aria-label="Back"></button></div>
    <div class="intro">
      <div class="art" id="permArt"></div>
      <h2 class="q">Turn on location</h2>
      <p class="sub" style="max-width:320px;margin:0">So we can find rooftops near you and log each visit in the app when you arrive. Nothing to tap mid-crawl.</p>
      <div class="alertbox" id="permWarn" hidden style="text-align:left"></div>
    </div>
    <button class="btn" id="permGo" type="button">Allow location</button>
  </section>

  <!-- PLAY -->
  <section class="view" id="v-play" hidden>
    <div class="ptop">

/* bar photos: Google Place photo, fetched live, never stored. Capped per phone per day. */
// Per phone, per day: photos for up to 40 different bars, and at most 120 photo loads in total.
// Seeing the same bar again (after the app reloads) doesn't use up one of the 40.
const PH_BARS=40,PH_LOADS=120,phMem={},phWait={};
function phDay(){try{const d=JSON.parse(localStorage.getItem("rr-ph")||"{}");if(d.k===new Date().toDateString()&&Array.isArray(d.ids))return d}catch(e){}return {k:new Date().toDateString(),ids:[],n:0}}

async function placeId(v){
  if(v.pid)return v.pid;S.pids=S.pids||{};if(S.pids[v.id])return S.pids[v.id];
  const {Place}=await google.maps.importLibrary("places");
  const r=await Place.searchByText({textQuery:`${v.name}, ${v.address}, Sydney NSW`,fields:["id"],locationBias:{lat:v.lat,lng:v.lng},maxResultCount:1});
  const id=r&&r.places&&r.places[0]&&r.places[0].id;if(id){S.pids[v.id]=id;save()}return id;

function barPhoto(v){
  if(phMem[v.id]!==undefined)return Promise.resolve(phMem[v.id]);
  if(phWait[v.id])return phWait[v.id];
  return phWait[v.id]=(async()=>{
    try{
      if(!phAllowed(v.id))return null;
      await gload();if(gBad)return null;
      const id=await placeId(v);if(!id)return phMem[v.id]=null;
      const {Place}=await google.maps.importLibrary("places");
      const pl=new Place({id});await pl.fetchFields({fields:["photos"]});
      const ph=pl.photos&&pl.photos[0];if(!ph)return phMem[v.id]=null;
      const a=(ph.authorAttributions||[])[0]||{};
      phBump(v.id);
      const url=ph.getURI({maxWidth:800,maxHeight:560});
      await new Promise(res=>{const im=new Image();const t=setTimeout(res,4000);im.onload=im.onerror=()=>{clearTimeout(t);res()};im.src=url;if(im.decode)im.decode().then(res,()=>{})});
      return phMem[v.id]={url,by:a.displayName||"",byUri:a.uri||"",gm:ph.googleMapsURI||""};

  })();
}

const tripMin=walkMin; // walking pace keeps final-stretch spins reachable

  const g=G(),rem=remaining()/60000,from=fromPoint();let P=basePool();
  if(g.started&&rem<=FINAL){

  if(a){if(dist(y,byId(a.id))-slack>LEAVE_M){closeVisit(a,now(),"walk");save()}}

function stats(r){

}

  const path=()=>{x.beginPath();pts.forEach((p,i)=>{const [X,Y]=P(p);i?x.lineTo(X,Y):x.moveTo(X,Y)})};
  x.lineCap="round";x.lineJoin="round";x.strokeStyle="#0B0D12";x.lineWidth=22;path();x.stroke();x.strokeStyle="#F5B83D";x.lineWidth=12;path();x.stroke();
  const [sx,sy]=P(pts[0]);x.fillStyle="#5AA9FF";x.beginPath();x.arc(sx,sy,16,0,7);x.fill();x.strokeStyle="#fff";x.lineWidth=5;x.stroke();
  st.arrived.forEach((v,i)=>{const [X,Y]=P(byId(v.id));x.fillStyle=v.counted===true?"#F5B83D":"#6B7280";x.beginPath();x.arc(X,Y,20,0,7);x.fill();x.strokeStyle="#0B0D12";x.lineWidth=5;x.stroke();x.fillStyle="#241803";x.font='800 22px system-ui,Arial';x.textAlign="center";x.fillText(String(i+1),X,Y+8);x.textAlign="left"});
}

    const free=g.started&&basePool().length<2,canMove=free||!g.voluntaryUsed;
    intro=`<b>Fancy a change of scenery?</b> Move your zone and every spin from then on lands in the new area. You get one move per game${free?", and right now it's free because your zone's nearly empty":""}.`;
    extra=canMove?`<button class="btn sm" type="button" id="bMove" style="margin-top:10px">${I.move} Move my zone</button>`:`<p class="note" style="margin-top:8px">You've used your zone move this game.</p>`;
    rows=others.filter(v=>!FAR.has(v.id)).map(v=>rowHTML(v,os(v),barStatus(v,c),y));
    const fo=others.filter(v=>FAR.has(v.id));if(fo.length)rows.push(farHead,...fo.map(v=>rowHTML(v,os(v),barStatus(v,c),y)));
    pins=others.map(v=>({v,cls:os(v).open?"":"off"}));
  }else if(f==="been"){
    const list=VENUES.filter(v=>{const s=barStatus(v,c);return s==="col"||s==="been"}).sort(sortD);
    intro=`Rooftops you've visited in a game or marked as been before. Turn on <b>New rooftops only</b> when you set up a game and these get skipped.`;
    rows=list.map(v=>rowHTML(v,os(v),barStatus(v,c),y));
    if(!rows.length)rows=[`<div class="empty" style="padding:22px 8px">Nothing here yet. Tap any rooftop in another tab and switch on "I've been here before".</div>`];
    pins=list.map(v=>({v,cls:"done"}));
  }else if(f==="nfu"){
    const list=VENUES.filter(v=>S.nfu[v.id]).sort(sortD);
    intro=`Rooftops your crew would never go to. These never come up in a spin. Tap one to bring it back.`;
    rows=list.map(v=>rowHTML(v,os(v),"nfu",y));
    if(!rows.length)rows=[`<div class="empty" style="padding:22px 8px">No bars hidden. If there's a rooftop you'd never go to, tap it in another tab and switch on "Not for us".</div>`];
    pins=list.map(v=>({v,cls:"off"}));
  }else{
    const list0=VENUES.filter(v=>!S.nfu[v.id]&&(f==="all"||os(v).open)).sort(sortD),list=list0.filter(v=>!FAR.has(v.id)),flist=list0.filter(v=>FAR.has(v.id));
    intro=`Every rooftop in Sydney${f==="open"?" that's open right now":""}. ${tapHint}`;
    rows=list.map(v=>rowHTML(v,os(v),barStatus(v,c),y));
    if(flist.length)rows.push(farHead,...flist.map(v=>rowHTML(v,os(v),barStatus(v,c),y)));
    if(!rows.length)rows=[`<div class="empty" style="padding:22px 8px">Nothing's open right now.</div>`];
    pins=list0.map(v=>({v,cls:barStatus(v,c)==="col"?"done":os(v).open?"":"off"}));
  }
  $("barsIntro").innerHTML=`<p class="note" style="margin:0">${intro}</p>${extra}`;
  $("barsList").innerHTML=rows.join("");
  $("barsList").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>barSheet(byId(b.dataset.id)));
  if($("bMove"))$("bMove").onclick=()=>openMove(g.started&&basePool().length<2);
  requestAnimationFrame(async()=>{
    if(!bMapP)bMapP=makeMap("barsMap").then(m=>{m.setView({lat:-33.8732,lng:151.2069},13);m.onTap((lat,lng)=>{if(S.test){S.fake={lat,lng};save();onLocation();renderBars()}});return m});
    const m=bMap=await bMapP;if(!m)return;m.resize();m.clear();
    if(g){m.circle(g.center,g.radius);if(m._zoneFor!==g.id+g.center.lat){m._zoneFor=g.id+g.center.lat;m.fitZone(g.center,g.radius)}}
    pins.forEach(({v,cls})=>m.pin(v,cls,()=>barSheet(v)));
    setMe(m);
  });
}
$("barsSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.barsFilter=b.dataset.v;save();renderBars()};
function barSheet(v){
  const t=now(),o=openState(v,t),y=you(),c=collectedMap(),s=barStatus(v,c);
  if(bMap&&S.route==="bars")bMap.setView(v,16);
  sheet(`${phBox(v,"sheetph")}<h3>${esc(v.name)}</h3><p class="note">${esc(v.area)} · ${esc(v.address)}${y?" · "+mOrKm(dist(y,v))+" away":""}</p>
    <p class="note" style="color:${o.open?"var(--green)":"var(--muted)"};margin-top:6px">${o.open?"Open now til "+clock12(o.closeAt):o.opens!=null?"Opens today at "+clock12(o.opens):(o.temp?"Temporarily closed":"Closed today")}</p>
    ${c[v.id]?`<p class="note" style="margin-top:6px"><span class="stamp col">Visited</span> first on ${dateTxt(c[v.id])}</p>`:""}
    <div class="acts">
      ${c[v.id]?"":`<button class="toggle" type="button" id="tgBeen" role="switch" aria-checked="${!!S.been[v.id]}"><span class="t"><b>I've been here before</b><small>"New rooftops only" games will skip it.</small></span><span class="sw"></span></button>`}
      <button class="toggle" type="button" id="tgNfu" role="switch" aria-checked="${!!S.nfu[v.id]}"><span class="t"><b>Not for us</b><small>Never comes up in a spin.</small></span><span class="sw"></span></button>
      <a class="btn dark" href="${gmapsURL(v)}" target="_blank" rel="noopener">${I.pin} Hours, menu &amp; reviews on Google</a>
    </div>`,()=>{
    if($("tgBeen"))$("tgBeen").onclick=()=>{if(S.been[v.id])delete S.been[v.id];else S.been[v.id]=1;save();barSheet(v);if(S.route==="bars")renderBars()};
    $("tgNfu").onclick=()=>{if(S.nfu[v.id])delete S.nfu[v.id];else S.nfu[v.id]=1;save();barSheet(v);if(S.route==="bars")renderBars()};
  });
}

/* ---------- history tab ---------- */
function renderHist(){
  const b=$("v-hist");
  if(!H.length){b.innerHTML=`<h1 class="q">History</h1><div class="empty">${I.trophy}<b style="color:var(--text);font-size:17px">No crawls yet</b><span>Finish a game and your scorecard lands here.</span><button class="btn" type="button" id="hStart" style="max-width:260px">Start a new game</button></div>`;$("hStart").onclick=startWizard;return}
  const games=H.length,bars=H.reduce((s,r)=>s+stats(r).counted.length,0),dist_=H.reduce((s,r)=>s+stats(r).total,0);
  const best=l=>{const x=H.filter(r=>r.len===l).map(r=>stats(r).counted.length);return x.length?Math.max(...x):null};
  b.innerHTML=`<h1 class="q">History</h1>
    <div class="grid2"><div class="stat"><small>Crawls</small><b style="font-size:24px">${games}</b></div><div class="stat"><small>Rooftop visits</small><b style="font-size:24px">${bars}</b></div>
    <div class="stat"><small>Distance covered</small><b>${km(dist_)}</b></div><div class="stat"><small>Most in one game</small><b>${LENS.filter(l=>best(l)!=null).map(l=>`${best(l)} <span class="small">(${l/60} hr)</span>`).join(" · ")}</b></div></div>
    <div style="display:flex;flex-direction:column;gap:10px">${H.map(r=>{const st=stats(r),bod=r.barOfDay?byId(r.barOfDay):null,nw=(r.newIds||[]).length;
     return `<button class="hrow" type="button" data-id="${r.id}"><span class="n">${st.counted.length}</span><span class="t"><b>${dateTxt(r.startedAt)} · ${r.len===60?"1 hr":"2 hr"}${nw?`<span class="newpill">+${nw} new</span>`:""}</b><small>${esc(r.areas.filter((a,i)=>a!==r.areas[i-1]).join(" → "))} · ${km(st.total)}${bod?" · ★ "+esc(bod.name):""}</small></span>${r.photo?`<img src="${r.photo}" alt="">`:""}</button>`}).join("")}</div>`;
  b.querySelectorAll(".hrow").forEach(x=>x.onclick=()=>{S.lastEnd=x.dataset.id;go("end")});
}

/* ---------- test mode ---------- */
$("testFab").onclick=()=>{
  const s=sydAt(now());
  sheet(`<h3>Test mode</h3><p class="note">Sydney ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][s.day]} ${clock12(s.min)}${S.ff?` (+${Math.round(S.ff/60000)} min)`:""}. Tap the Rooftops map to move yourself.</p>
   <div class="eyebrow" style="margin:14px 0 8px">Time travel</div><div class="trow">${G()&&G().started?`<span class="note">Finish or end your game first.</span>`:`<button class="btn sm dark" type="button" data-to="4,1080">Friday 6pm</button><button class="btn sm dark" type="button" data-to="5,900">Saturday 3pm</button>`}</div>
   <div class="eyebrow" style="margin:14px 0 8px">Fast-forward</div><div class="trow">${[1,5,15,60].map(m=>`<button class="btn sm dark" type="button" data-ff="${m}">+${m<60?m+" min":"1 hr"}</button>`).join("")}</div>
   ${G()?`<div class="eyebrow" style="margin:14px 0 8px">Move me</div><div class="trow"><button class="btn sm dark" type="button" id="tA">Arrive at target</button><button class="btn sm dark" type="button" id="tL">Leave (200 m)</button></div>`:""}
   <div class="eyebrow" style="margin:14px 0 8px">Put me at a bar</div><select id="tJ"><option value="">Choose…</option>${VENUES.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join("")}</select>
   <div class="trow" style="margin-top:14px"><button class="btn sm line" type="button" id="tR">Real time</button><button class="btn sm line" type="button" id="tF">Replay intro</button><button class="btn sm line" type="button" id="tP">Reset photo limit</button><button class="btn sm line" type="button" id="tX">Reset all</button><button class="btn sm line" type="button" id="tO">Test off</button></div>`,()=>{
    $("sheetBody").querySelectorAll("[data-ff]").forEach(b=>b.onclick=()=>{S.ff=(S.ff||0)+ +b.dataset.ff*60000;save();loop();closeSheet();render()});
    if($("tA"))$("tA").onclick=()=>{const g=G();if(!g||!g.target)return;const v=byId(g.target);S.fake={lat:v.lat+.0002,lng:v.lng};save();closeSheet();animateId="at:"+v.id;onLocation()};
    if($("tL"))$("tL").onclick=()=>{const y=you();if(!y)return;S.fake={lat:y.lat+.0018,lng:y.lng};save();closeSheet();onLocation()};
    $("tJ").onchange=e=>{const v=byId(e.target.value);if(v){S.fake={lat:v.lat,lng:v.lng};save();closeSheet();onLocation();render()}};
    $("tR").onclick=()=>{S.ff=0;save();closeSheet();render()};
    $("sheetBody").querySelectorAll("[data-to]").forEach(b=>b.onclick=()=>{const [dd,mm]=b.dataset.to.split(",").map(Number),s0=sydAt(now());let d=((dd-s0.day+7)%7)*1440+(mm-s0.min);if(d<=0)d+=7*1440;S.ff=(S.ff||0)+d*60000;save();closeSheet();render()});
    $("tP").onclick=()=>{try{localStorage.removeItem("rr-ph")}catch(e){}for(const k in phMem)delete phMem[k];closeSheet();render()};
    $("tF").onclick=()=>{S.onboarded=false;S.intro=0;S.tips={};save();closeSheet();go("intro")};
    $("tX").onclick=()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(HKEY)}catch(e){}location.reload()};
    $("tO").onclick=()=>{S.test=false;S.ff=0;S.fake=null;save();history.replaceState(null,"",location.pathname);closeSheet();if(S.game)startWatch();render()};
  });
};

/* ---------- loop ---------- */
function loop(){
  const g=G();
  if(g&&g.started&&!g.ended&&now()>=g.endsAt){endGame(g.endsAt);return}
  if(S.route==="play"&&g){
    renderClock();const a=atVisit(),d=$("dwell");if(a&&d)d.textContent=mmss(now()-a.arrivedAt);
    if(a&&!spinning&&(now()-a.arrivedAt)>=DWELL_MIN*60000&&!a._shown){a._shown=1;renderPlay()}
    if(a&&!spinning&&(now()-a.arrivedAt)<DWELL_MIN*60000&&$("cantBtn")===null&&false)renderPlay();
    if(!spinning&&g.started&&remaining()<=FINAL*60000&&!g.shownFinal)renderPlay();
    if(g.started&&!spinning){const r=remaining();if(r>0&&r<=10000)tick(1200)}
    if(!spinning&&g.target&&needManual(g)!==!!g._man)renderPlay();
  }
}
setInterval(loop,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){loop();const g=G();if(g&&g.celebrate){setTimeout(()=>celebrate(g.celebrate),350)}else if(S.route==="play")renderPlay()}});

/* ---------- boot ---------- */
if(S.game&&!S.test)startWatch();
if(!S.test&&navigator.permissions&&navigator.geolocation)permState().then(s=>{if(s==="granted")getOnce().then(()=>{[zMap,bMap].forEach(setMe);if(S.route==="bars")renderBars()}).catch(()=>{})});
render();loop();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
