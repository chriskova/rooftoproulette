</head>
<body>
<div class="app" id="app">

  <!-- INTRO (first open) -->
  <section class="view" id="v-intro" hidden>
    <div style="display:flex;justify-content:flex-end"><button class="txtbtn" id="introSkip" type="button">Skip</button></div>
    <div class="intro" id="introBody"></div>
    <div class="dots" id="introDots"><i></i><i></i><i></i></div>
    <button class="btn" id="introNext" type="button">Next</button>
  </section>

  <!-- HOME -->
  <section class="view" id="v-home" hidden>
    <div class="hero">
      <div class="brand">Rooftop<br><span>Roulette</span></div>
      <div class="sub" style="color:var(--text)">Spin. Go. Drink. Repeat.</div>
      <button class="btn" id="newGame" type="button">Start a new game</button>
    </div>
    <button class="colcard" type="button" id="homeCol"></button>
    <div class="card">
      <div class="eyebrow" style="margin-bottom:12px">How it works</div>
      <div class="steps" id="homeSteps"></div>
    </div>
    <div class="city">${PIN} <span><b>Sydney</b> only, for now.</span></div>
  </section>

  <!-- WIZARD -->
  <section class="view" id="v-wiz" hidden>
    <div class="wtop">
      <button class="iconbtn" id="wBack" type="button" aria-label="Back"></button>
      <div class="prog"><i id="wProg"></i></div>
      <button class="iconbtn" id="wClose" type="button" aria-label="Close"></button>
    </div>
    <div id="wBody" style="display:flex;flex-direction:column;gap:16px"></div>
  </section>

  <!-- LOCATION PRIMER -->
  <section class="view" id="v-perm" hidden>
    <div class="wtop"><button class="iconbtn" id="pBack" type="button" aria-label="Back"></button></div>
    <div class="intro">
      <div class="art" id="permArt"></div>
      <h2 class="q">Turn on location</h2>
      <p class="sub" style="max-width:320px;margin:0">So we can find rooftops near you and log each visit in the app when you arrive. Nothing to tap mid-crawl.</p>
      <div class="alertbox" id="permWarn" hidden style="text-align:left"></div>
    </div>
    <button class="btn" id="permGo" type="button">Allow location</button>
  </section>

  <!-- PLAY -->
  <section class="view" id="v-play" hidden>
    <div class="ptop">
      <div class="count" id="pCount"></div>
      <div class="clock" id="clock"><b id="clockT">60:00</b><small id="clockL">Left</small></div>
      <button class="iconbtn" id="pMenu" type="button" aria-label="Game menu"></button>
    </div>
    <div class="tbar" id="tbar"><i id="tbarI"></i></div>
    <div class="strip" id="strip"></div>
    <div class="stage" id="stage"></div>
    <div class="note" id="gpsNote" style="text-align:center"></div>
  </section>

  <!-- SCORECARD -->
  <section class="view" id="v-end" hidden></section>

  <!-- ROOFTOPS TAB -->
  <section class="view" id="v-bars" hidden>
    <h1 class="q">Rooftops</h1>
    <button class="colcard" type="button" id="barsCol" style="cursor:default"></button>
    <div class="areas" id="barsAreas"></div>
    <div class="map"><div id="barsMap" style="height:34vh;min-height:220px"></div></div>
    <div class="seg" id="barsSeg">
      <button type="button" data-v="all" aria-pressed="true">All</button>
      <button type="button" data-v="todo">Not yet</button>
      <button type="button" data-v="done">Collected</button>
      <button type="button" data-v="open">Open now</button>
    </div>
    <div class="list card" id="barsList" style="padding:4px 16px"></div>
  </section>

  <!-- HISTORY TAB -->
  <section class="view" id="v-hist" hidden></section>

  <nav class="tabs" id="tabs" role="tablist">
    <button type="button" role="tab" data-tab="play" id="tPlay"></button>
    <button type="button" role="tab" data-tab="bars" id="tBars"></button>
    <button type="button" role="tab" data-tab="hist" id="tHist"></button>
  </nav>
  <div class="cta" id="cta" hidden></div>
  <button class="testfab" id="testFab" type="button" hidden>TEST</button>
</div>

<dialog class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></dialog>

<script src="vendor/leaflet/leaflet.js"></script>
<script>

const AREAS=[
 {name:"Town Hall",d:"City centre",lat:-33.8732,lng:151.2069},

 {name:"Wynyard",d:"City north",lat:-33.8659,lng:151.2059},
 {name:"Circular Quay",d:"Harbour & The Rocks",lat:-33.8614,lng:151.2108},
 {name:"Barangaroo",d:"Waterfront",lat:-33.8630,lng:151.2017},
 {name:"Central",d:"City south",lat:-33.8832,lng:151.2063},
 {name:"Darlinghurst",d:"Oxford St",lat:-33.8790,lng:151.2183},
 {name:"Surry Hills",d:"Crown St",lat:-33.8857,lng:151.2122},
 {name:"Potts Point",d:"Kings Cross",lat:-33.8730,lng:151.2235},
 {name:"Pyrmont",d:"Darling Harbour",lat:-33.8705,lng:151.1947},
 {name:"North Sydney",d:"North shore",lat:-33.8403,lng:151.2073},
 {name:"Newtown",d:"Inner west",lat:-33.8978,lng:151.1793},
 {name:"Manly",d:"Northern beaches",lat:-33.7988,lng:151.2860},
 {name:"Coogee",d:"Eastern beaches",lat:-33.9205,lng:151.2560}
];
const RADII=[1,1.5,2],LENS=[60,120],SKIPS=3;
const CHECKIN_M=75,LEAVE_M=150,DWELL_MIN=5,SOON=30,FINAL=30;
const KEY="rr-app-v3",HKEY="rr-history-v2";
const $=id=>document.getElementById(id);
const byId=id=>VENUES.find(v=>v.id===id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- icons ---------- */
const I={
 dice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></svg>',
 pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
 trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
 nav:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>',
 go:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h12M12 6l6 6-6 6"/><path d="M20 5v14"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>',
 city:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 21h18M5 21V8l5-3v16M10 21V3l6 3v15M16 21v-9l3 2v7"/></svg>',
 ring:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>',
 bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
 hour2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5h5"/></svg>',
 move:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
 flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
 help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>',
 bulb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.5.4.9 1 .9 1.6V16h5.2v-.5c0-.6.4-1.2.9-1.6A6 6 0 0 0 12 3z"/></svg>',
 glass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14l-7 8z"/><path d="M12 12v8M8 20h8"/></svg>',
 camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>',
 sparkle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>'
};
const tabIcons={play:I.dice,bars:I.pin,hist:I.trophy};

/* ---------- state ---------- */
let S={route:null,onboarded:false,intro:0,wiz:null,test:false,ff:0,fake:null,sound:true,game:null,lastEnd:null,tips:{},barsFilter:"all",last:{radius:1.5,len:60,newOnly:false},been:{},nfu:{},reports:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)S=Object.assign(S,s)}catch(e){}
S.been=S.been||{};S.nfu=S.nfu||{};S.reports=S.reports||[];
if(/[?&]test\b/.test(location.search))S.test=true;
let H=[];try{H=JSON.parse(localStorage.getItem(HKEY)||"[]")||[]}catch(e){H=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const saveH=()=>{try{localStorage.setItem(HKEY,JSON.stringify(H))}catch(e){for(let i=H.length-1;i>=0;i--){if(H[i].photo){H[i].photo=null;try{localStorage.setItem(HKEY,JSON.stringify(H));return}catch(_){}}}}};
const now=()=>Date.now()+(S.ff||0);

/* ---------- time + hours ---------- */
function sydAt(ts){
  const p=new Intl.DateTimeFormat("en-AU",{timeZone:"Australia/Sydney",weekday:"short",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date(ts));
  const g=t=>p.find(x=>x.type===t).value;let h=+g("hour");if(h===24)h=0;
  return {day:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(g("weekday")),min:h*60+ +g("minute")};
}
function openState(v,ts){
  const {day,min}=sydAt(ts),prev=(day+6)%7;
  for(const [o,c] of v.hours[prev]) if(c>1440&&min<c-1440) return {open:true,until:c-1440-min,closeAt:c-1440};
  let opens=null;
  for(const [o,c] of v.hours[day]){if(min>=o&&min<c) return {open:true,until:c-min,closeAt:c%1440};if(o>min&&(opens===null||o<opens))opens=o}
  return {open:false,opens};
}
const openOK=(v,ts)=>{const s=openState(v,ts);return s.open&&s.until>SOON};
function clock12(m){m=((m%1440)+1440)%1440;let h=Math.floor(m/60),mm=m%60;const ap=h>=12?"pm":"am";h=h%12||12;return h+(mm?":"+String(mm).padStart(2,"0"):"")+ap}
const mmss=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const hmm=ms=>{if(ms<60000)return "<1 min";const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m":m+" min"};
const dateTxt=ts=>new Date(ts).toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"});

/* ---------- geo ---------- */
function dist(a,b){const R=6371000,t=x=>x*Math.PI/180;return 2*R*Math.asin(Math.sqrt(Math.sin(t(b.lat-a.lat)/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(t(b.lng-a.lng)/2)**2))}
const km=m=>(m/1000).toFixed(m<10000?1:0)+" km";
const mOrKm=m=>m<1000?Math.round(m/10)*10+" m":km(m);
const nearestArea=p=>AREAS.slice().sort((a,b)=>dist(p,a)-dist(p,b))[0].name;

/* ---------- collection ---------- */
function collectedMap(){ // id -> first date collected in a game
  const m={};
  const add=(v,t)=>{if(v.counted===true&&(!m[v.id]||t<m[v.id]))m[v.id]=t};
  H.forEach(r=>r.visits.forEach(v=>add(v,v.arrivedAt)));
  if(S.game)S.game.visits.forEach(v=>add(v,v.arrivedAt));
  return m;
}
const listed=()=>VENUES.filter(v=>!S.nfu[v.id]);
function colStats(list){const c=collectedMap(),L=list||listed();const col=L.filter(v=>c[v.id]).length,been=L.filter(v=>!c[v.id]&&S.been[v.id]).length;return {col,been,total:L.length,c}}
const isNew=(id,c)=>!(c||collectedMap())[id]&&!S.been[id];
/* bars that can come up in a spin: not hidden, optionally only new */
function playable(list,newOnly){const c=collectedMap();return list.filter(v=>!S.nfu[v.id]&&(!newOnly||isNew(v.id,c)))}
const inCircle=(c,r)=>VENUES.filter(v=>dist(c,v)<=r*1000);
const openIn=(c,r,t,newOnly)=>playable(inCircle(c,r),newOnly).filter(v=>openOK(v,t||now()));
function avgHop(list){if(list.length<2)return null;let s=0,n=0;for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){s+=dist(list[i],list[j]);n++}return s/n}

/* ---------- location ---------- */
let here=null,watchId=null,locErr=null;
const you=()=>S.test?(S.fake||null):here;
function startWatch(){
  if(S.test||watchId!==null||!navigator.geolocation)return;
  watchId=navigator.geolocation.watchPosition(p=>{here={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};locErr=null;onLocation()},
    e=>{locErr=e.code;if(S.route==="play")renderPlay()},{enableHighAccuracy:true,maximumAge:10000,timeout:30000});
}
function stopWatch(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}}
function getOnce(){
  if(S.test)return Promise.resolve(S.fake||{lat:-33.8732,lng:151.2069});
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej({code:-1});
    navigator.geolocation.getCurrentPosition(p=>{here={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};res(here)},rej,{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
  });
}
async function permState(){if(S.test)return "granted";try{const p=await navigator.permissions.query({name:"geolocation"});return p.state}catch(e){return "prompt"}}

/* ---------- sound + haptics ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tick(p){if(!S.sound)return;const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type="square";o.frequency.setValueAtTime(p,t);f.type="bandpass";f.frequency.value=p;f.Q.value=4;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+.035);o.connect(f).connect(g).connect(a.destination);o.start(t);o.stop(t+.05)}
function ding(){if(!S.sound)return;const a=ac();if(!a)return;const t=a.currentTime,lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=3200;lp.connect(a.destination);[[659.25,0],[987.77,.06],[1318.5,.13]].forEach(([hz,dt])=>{const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=hz;const st=t+dt;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.14,st+.015);g.gain.exponentialRampToValueAtTime(.0001,st+.9);o.connect(g).connect(lp);o.start(st);o.stop(st+.95)})}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- maps ---------- */
const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}";
const ESRI_LBL="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}";
const OSM="https://tile.openstreetmap.org/{z}/{x}/{y}.png";
let tilesFallback=false;
function mkMap(el,opts){
  const m=L.map(el,Object.assign({zoomControl:false,attributionControl:true,zoomSnap:.25},opts||{}));
  const useOSM=()=>{m.eachLayer(l=>{if(l instanceof L.TileLayer)m.removeLayer(l)});m.getContainer().classList.add("osm");L.tileLayer(OSM,{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(m)};
  if(tilesFallback){useOSM();return m}
  let errs=0;
  const base=L.tileLayer(ESRI,{attribution:'Esri, HERE, Garmin, &copy; OpenStreetMap',maxNativeZoom:16,maxZoom:19});
  base.on("tileerror",()=>{if(++errs===3){tilesFallback=true;useOSM()}});
  base.addTo(m);
  L.tileLayer(ESRI_LBL,{maxNativeZoom:16,maxZoom:19,pane:"overlayPane",opacity:.85}).addTo(m);
  return m;
}
const pinIcon=cls=>L.divIcon({className:"",html:`<div class="pin ${cls||""}"></div>`,iconSize:cls==="big"?[26,26]:cls==="off"?[13,13]:[20,20]});
const numIcon=(n,x)=>L.divIcon({className:"",html:`<div class="num${x?" x":""}">${n}</div>`,iconSize:[24,24]});
const meIcon=L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18]});
const zoneCircle=(c,r)=>L.circle([c.lat,c.lng],{radius:r*1000,color:"#F5B83D",weight:2,opacity:.9,fillColor:"#F5B83D",fillOpacity:.06,interactive:false});
function fitZone(m,c,r,extra){let b=L.latLng(c.lat,c.lng).toBounds(r*2000*1.12);(extra||[]).forEach(p=>b.extend(p));m.fitBounds(b,{animate:false,padding:[8,8]})}
function setMe(m){const y=you();if(!m)return;if(!y){if(m._me){m.removeLayer(m._me);m._me=null}return}
  if(!m._me)m._me=L.marker([y.lat,y.lng],{icon:meIcon,zIndexOffset:1000,interactive:false}).addTo(m);else m._me.setLatLng([y.lat,y.lng])}

/* ---------- router ---------- */
const VIEWS=["intro","home","wiz","perm","play","end","bars","hist"];
function go(route){S.route=route;save();render()}
function render(){
  if(!S.onboarded&&S.route!=="intro"&&!S.game)S.route="intro";
  if(!S.route)S.route=S.game?"play":"home";
  if(S.route==="play"&&!S.game)S.route="home";
  const r=S.route;
  VIEWS.forEach(v=>$("v-"+v).hidden=v!==r);
  const tabbed=["home","play","end","bars","hist"].includes(r);
  $("tabs").hidden=!tabbed;$("app").classList.toggle("has-tabs",tabbed);
  const tab=r==="bars"?"bars":r==="hist"?"hist":"play";
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  const live=$("tPlay").querySelector(".live");if(live)live.hidden=!S.game;
  $("cta").hidden=true;$("app").classList.remove("has-cta");
  $("testFab").hidden=!S.test;
  ({intro:renderIntro,home:renderHome,wiz:renderWiz,perm:renderPerm,play:renderPlay,end:renderEnd,bars:renderBars,hist:renderHist})[r]();
  $("v-"+r).scrollTop=0;
}
function cta(html,on){const c=$("cta");c.innerHTML=html;c.hidden=false;$("app").classList.add("has-cta");if(on)on(c)}
[["tPlay","play","Play"],["tBars","bars","Rooftops"],["tHist","hist","History"]].forEach(([id,k,l])=>{$(id).innerHTML=tabIcons[k]+`<span>${l}</span>`+(k==="play"?'<i class="live" hidden></i>':"");$(id).dataset.tab=k});
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.tab;if(k==="play")go(S.game?"play":"home");else go(k)};

/* ---------- shared copy ---------- */
const RULES=[
 ["Spin","You get a random rooftop in your zone. The clock starts on your first spin."],
 ["Get there","Walk it, run it, train it, Uber it. Your visit is logged in the app when you arrive."],
 ["Stay 5 minutes and it counts","Then spin again. Leave sooner and we'll ask if it should count."]
];
const stepsHTML=list=>list.map((s,i)=>`<div class="step"><span class="k">${i+1}</span><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join("");

/* ---------- intro ---------- */
const SLIDES=[
 {art:I.dice,h:"Let the wheel pick",p:"One tap and Rooftop Roulette picks your next rooftop bar. No debating, no planning."},

      <div class="opts">${rows.map(o=>`<button class="opt" type="button" role="radio" data-r="${o.r}" aria-checked="${w.radius===o.r}" ${o.n?"":"disabled"}><span class="ic">${I.ring}</span><span class="t"><b>${o.r} km${o.r===rec?`<span class="tag">Best for ${w.len===60?"1 hour":"2 hours"}</span>`:""}</b><small>${desc[o.r]}${o.hop?`<br>Average trip between bars: ${km(o.hop)}`:""}</small></span><span class="n"><b>${o.n}</b><small>open</small></span></button>`).join("")}</div>`;

    cta(`<button class="btn" id="wStart" type="button" ${open.length?"":"disabled"}>Let's go</button>`,()=>$("wStart").onclick=tryStart);
    requestAnimationFrame(()=>{
      if(zMap){zMap.remove();zMap=null}
      zMap=mkMap("zoneMap");zoneCircle(c,w.radius).addTo(zMap);
      const openIds=new Set(open.map(v=>v.id));
      all.forEach(v=>L.marker([v.lat,v.lng],{icon:pinIcon(openIds.has(v.id)?"":"off")}).addTo(zMap).bindTooltip(v.name,{direction:"top",offset:[0,-10]}));

async function useMe(){
  const w=S.wiz;
  try{
    const p=await getOnce();const n=openIn(p,1.5).length;
    if(n<2){const near=VENUES.slice().sort((a,b)=>dist(p,a)-dist(p,b))[0];w.start=null;w.meNote=`Not enough rooftops open around you right now (the nearest is ${km(dist(p,near))} away). Pick an area below and start from there.`}
    else{w.start={type:"me",name:"you",lat:p.lat,lng:p.lng,n,sub:"Near "+nearestArea(p)};w.meNote=null}
  }catch(e){w.meNote="Couldn't find you just now. Pick an area below instead."}
  save();go("wiz");
}
$("wBack").onclick=()=>{const w=S.wiz;if(w.step>0){w.step--;save();renderWiz()}else go("home")};
$("wClose").onclick=()=>{S.wiz=null;go("home")};

  if(!S.test){const st=await permState();if(st!=="granted"&&!here){S.permNext="start";go("perm");return}}

/* ---------- permission primer ---------- */
function renderPerm(){$("pBack").innerHTML=I.back;$("permArt").innerHTML=I.pin;$("permWarn").hidden=true}

/* ---------- game logic ---------- */
const G=()=>S.game;
const atVisit=()=>{const g=G();return g&&g.visits.find(v=>v.leftAt==null)};
const visited=id=>G().visits.some(v=>v.id===id);
const remaining=()=>{const g=G();return g.started?g.endsAt-now():g.len*60000};
function fromPoint(){const y=you();if(y)return y;const a=atVisit();if(a)return byId(a.id);const g=G();return g.visits.length?byId(g.visits[g.visits.length-1].id):g.startPos}
function basePool(){const g=G(),t=now(),skipped=g.skipped||[];return playable(inCircle(g.center,g.radius),g.newOnly).filter(v=>!visited(v.id)&&v.id!==g.target&&!skipped.includes(v.id)&&openOK(v,t))}
const tripMin=(a,b)=>Math.max(1,Math.round(dist(a,b)*1.3/80)); // walking pace, used only to keep final-stretch spins reachable
function spinPool(){
  const g=G(),rem=remaining()/60000,from=fromPoint();let P=basePool();
  if(g.started&&rem<=FINAL){
    const reach=P.filter(v=>tripMin(from,v)<=rem/2);if(reach.length)return {pool:reach,final:true};
    let cand=P.length?P:playable(VENUES,false).filter(v=>!visited(v.id)&&v.id!==g.target&&openState(v,now()).open);
    return {pool:cand.slice().sort((a,b)=>dist(from,a)-dist(from,b)).slice(0,3),final:true};
  }
  return {pool:P,final:false};
}
function closeVisit(v,t,reason){if(!v||v.leftAt!=null)return;v.leftAt=t;if(reason==="end")v.counted=v.arrivedAt<G().endsAt;else v.counted=(t-v.arrivedAt)/60000>=DWELL_MIN?true:null}
function onLocation(){
  const g=G();[bMap,zMap].forEach(setMe);
  if(!g||g.ended)return;
  const y=you();if(!y)return;
  const slack=Math.min(y.acc||0,40),a=atVisit();
  if(a){if(dist(y,byId(a.id))-slack>LEAVE_M){closeVisit(a,now(),"walk");save()}}
  else if(g.target&&g.started&&now()<g.endsAt){
    const v=byId(g.target);
    if(dist(y,v)-slack<=CHECKIN_M){g.visits.push({id:v.id,arrivedAt:now(),leftAt:null,counted:undefined});g.target=null;ding();buzz([60,40,60]);save()}
  }
  if(S.route==="play")renderPlay();
}
let spinning=false,animateId=null;
function doSpin(){
  const g=G();if(spinning||!g||g.ended)return;ac();
  if(!g.started){const t=now();g.started=true;g.startedAt=t;g.endsAt=t+g.len*60000;const y=you();if(y)g.startPos={lat:y.lat,lng:y.lng}}
  const a=atVisit();if(a)closeVisit(a,now(),"spin");
  const {pool:P}=spinPool();
  if(!P.length){save();renderPlay();openMove(true);return}
  const pick=P[Math.floor(Math.random()*P.length)],from=fromPoint();
  spinning=true;seen("spin");renderPlay();
  const names=inCircle(g.center,g.radius).map(v=>v.name);if(names.length<5)VENUES.forEach(v=>names.push(v.name));
  $("stage").innerHTML=`<div class="reel"><div class="reelrow" id="r0"></div><div class="reelrow mid" id="r1"></div><div class="reelrow" id="r2"></div></div>`;
  const fast=18+Math.floor(Math.random()*4),delays=[...Array(fast).fill(42),58,78,104,136,176,220];
  let i=0,k=Math.floor(Math.random()*names.length);
  const step=()=>{
    const last=i===delays.length-1,nm=j=>names[(k+j+names.length)%names.length];
    $("r0").textContent=nm(-1);$("r1").textContent=last?pick.name:nm(0);$("r2").textContent=nm(1);
    ["r0","r1","r2"].forEach(r=>{const el=$(r);el.classList.remove("flip");void el.offsetWidth;el.classList.add("flip")});
    tick(last?900:600+Math.random()*80);buzz(5);k++;
    if(!last){setTimeout(step,delays[i++]);return}
    setTimeout(()=>{g.target=pick.id;g.targetAt=now();g.targetFrom={lat:from.lat,lng:from.lng};animateId=pick.id;spinning=false;ding();buzz(40);save();renderPlay();onLocation()},420);
  };
  step();
}
function answer(idx,yes){const v=G()&&G().visits[idx];if(v){v.counted=!!yes;save();renderPlay()}}

/* ---------- tips (first game only) ---------- */
const seen=k=>{if(!S.tips[k]){S.tips[k]=1;save()}};
function tip(k,text,arrow){if(S.tips[k])return "";return `<div class="tip${arrow?"":" nob"}" data-tip="${k}">${I.bulb}<span>${text}</span><button type="button">Got it</button></div>`}
document.addEventListener("click",e=>{const b=e.target.closest(".tip button");if(!b)return;const t=b.closest(".tip");seen(t.dataset.tip);t.remove()});

/* ---------- sheets ---------- */
function sheet(html,bind){$("sheetBody").innerHTML=html;if(bind)bind();const d=$("sheet");if(!d.open)d.showModal()}
const closeSheet=()=>{const d=$("sheet");if(d.open)d.close()};
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))closeSheet()});

function moveOptions(){
  const g=G(),t=now(),from=fromPoint();
  return AREAS.filter(a=>dist(a,g.center)>500).map(a=>({a,open:playable(inCircle(a,g.radius),g.newOnly).filter(v=>!visited(v.id)&&openOK(v,t)).length,m:dist(from,a)}))
   .filter(o=>o.open>=2).sort((x,y)=>x.m-y.m).slice(0,6);
}
function openMove(free){
  const g=G(),opts=moveOptions();
  sheet(`<h3>${free?"Your zone's run dry":"Change of scenery?"}</h3>
    <p class="note">${free?"Fewer than two bars are left open here, so this move is free.":"You can move your zone once per game. Spins land in the new area from now on."}</p>
    <div class="opts">${opts.length?opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="ic">${I.city}</span><span class="t"><b>${esc(o.a.name)}</b><small>${mOrKm(o.m)} away</small></span><span class="n"><b>${o.open}</b><small>open</small></span></button>`).join(""):`<p class="note">No other area has two or more rooftops open right now.</p>`}</div>
    <button class="btn dark" type="button" id="mvX" style="margin-top:14px">${free?"Close":"Stay here"}</button>`,()=>{
    $("sheetBody").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];g.center={lat:o.a.lat,lng:o.a.lng};g.areas.push(o.a.name);g.moves.push({at:now(),to:o.a.name,free:!!free});if(!free)g.voluntaryUsed=true;save();closeSheet();renderPlay()});
    $("mvX").onclick=closeSheet;
  });
}
function howSheet(){

    ["Spin","You get a random open rooftop in your zone. The clock starts on your first spin. In the last 30 minutes, spins only pick bars you can reach in time."],
    ["Get there","However you like. Your visit is logged in the app when you arrive (within about 75 m of the bar)."],
    ["Stay 5 minutes and it counts","Leave sooner and we'll ask if it should count. Your last bar counts if you get there before zero."],

  </div>`,()=>{

    $("mEnd").onclick=()=>sheet(`<h3>End the game now?</h3><p class="note">${g.started?"Your scorecard is saved. The bar you're at counts if your visit's been logged.":"You haven't spun yet, so nothing will be saved."}</p>
      <div class="acts"><button class="btn" type="button" id="eY" style="background:var(--red);color:#fff">End game</button><button class="btn dark" type="button" id="eN">Keep playing</button></div>`,()=>{$("eN").onclick=closeSheet;$("eY").onclick=()=>{closeSheet();endGame(now())}});
  });

$("pMenu").onclick=openMenu;

function endGame(at){
  const g=G();if(!g||g.ended)return;
  if(!g.started){S.game=null;save();stopWatch();go("home");return}
  const before=collectedMap();
  const t=Math.min(at,g.endsAt),early=at<g.endsAt;if(early)g.endsAt=at;
  const a=atVisit();if(a)closeVisit(a,t,"end");
  if(g.target){const y=you(),v=byId(g.target);g.missed={id:v.id,m:y?Math.round(dist(y,v)):null}}
  g.ended=true;g.endedAt=t;g.early=early;
  const rec=JSON.parse(JSON.stringify(g));
  // which bars were new to the collection in this game
  const prevCol={};H.forEach(r=>r.visits.forEach(v=>{if(v.counted===true)prevCol[v.id]=1}));
  rec.newIds=rec.visits.filter(v=>v.counted===true&&!prevCol[v.id]).map(v=>v.id);
  H.unshift(rec);saveH();
  S.lastEnd=g.id;S.game=null;save();stopWatch();closeSheet();ding();buzz([100,60,100,60,200]);go("end");
}

/* ---------- play render ---------- */
function renderPlay(){
  const g=G();if(!g)return;
  $("pMenu").innerHTML=I.more;
  const counted=g.visits.filter(v=>v.counted===true).length;
  $("pCount").innerHTML=`${I.glass.replace('<svg','<svg width="18" height="18" style="color:var(--amber)"')} <b>${counted}</b>`;

function renderClock(){
  const g=G();if(!g)return;const r=remaining(),tot=g.len*60000;
  $("clockT").textContent=mmss(r);
  if(!g.started){$("clock").className="clock";$("tbar").className="tbar";$("tbarI").style.width="100%";$("clockL").textContent="Starts on spin";return}
  const warn=r<=FINAL*60000&&r>10*60000,red=r<=10*60000;
  $("clock").className="clock"+(red?" red":warn?" warn":"");
  $("tbar").className="tbar"+(red?" red":warn?" warn":"");
  $("tbarI").style.width=Math.max(0,Math.min(100,r/tot*100))+"%";
  $("clockL").textContent=r<=FINAL*60000?"Final stretch":"Left";
}

/* ---------- stats + scorecard ---------- */
function stats(r){
  const arrived=r.visits.filter(v=>v.arrivedAt!=null),counted=arrived.filter(v=>v.counted===true);
  const pts=[r.startPos,...arrived.map(v=>byId(v.id))];let total=0,legs=[];
  for(let i=1;i<pts.length;i++){const d=dist(pts[i-1],pts[i])*1.3;total+=d;legs.push({to:arrived[i-1],d})}
  const longest=legs.slice().sort((a,b)=>b.d-a.d)[0];let quick=null;
  for(let i=1;i<arrived.length;i++){const p=arrived[i-1];if(p.leftAt!=null){const dt=arrived[i].arrivedAt-p.leftAt;if(dt>=0&&(!quick||dt<quick.ms))quick={ms:dt,from:p.id,to:arrived[i].id}}}
  return {arrived,counted,total,longest,quick,dur:(r.endedAt||r.endsAt)-r.startedAt,last:arrived[arrived.length-1]};
}

    L.marker(pts[0],{icon:meIcon}).addTo(eMap);
    st.arrived.forEach((v,i)=>{const b=byId(v.id);L.marker([b.lat,b.lng],{icon:numIcon(i+1,v.counted!==true)}).addTo(eMap).bindTooltip(b.name)});
    eMap.fitBounds(L.latLngBounds(pts).pad(.3),{animate:false,maxZoom:16});
  });
}
function shrink(file,max){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};img.src=u})}

    $("tR").onclick=()=>{S.ff=0;save();closeSheet();render()};
    $("tF").onclick=()=>{S.onboarded=false;S.intro=0;S.tips={};save();closeSheet();go("intro")};
    $("tX").onclick=()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(HKEY)}catch(e){}location.reload()};
    $("tO").onclick=()=>{S.test=false;S.ff=0;S.fake=null;save();history.replaceState(null,"",location.pathname);closeSheet();if(S.game)startWatch();render()};
  });
};

/* ---------- loop ---------- */
function loop(){
  const g=G();
  if(g&&g.started&&!g.ended&&now()>=g.endsAt){endGame(g.endsAt);return}
  if(S.route==="play"&&g){
    renderClock();const a=atVisit(),d=$("dwell");if(a&&d)d.textContent=mmss(now()-a.arrivedAt);
    if(a&&!spinning&&(now()-a.arrivedAt)>=DWELL_MIN*60000&&!a._shown){a._shown=1;renderPlay()}
    if(!spinning&&g.started&&remaining()<=FINAL*60000&&!g.shownFinal)renderPlay();
  }
}
setInterval(loop,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){loop();if(S.route==="play")renderPlay()}});

/* ---------- boot ---------- */
if(S.game&&!S.test)startWatch();
if(!S.test&&navigator.permissions&&navigator.geolocation)permState().then(s=>{if(s==="granted")getOnce().then(()=>{[zMap,bMap].forEach(setMe);if(S.route==="bars")renderBars()}).catch(()=>{})});
render();loop();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
